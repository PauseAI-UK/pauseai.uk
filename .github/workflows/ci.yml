name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a pull request cancels its run still in progress, whose result
# no longer counts. Each push to main runs in a group of its own, so every
# merge is checked to the end and none waits on another.
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job's token reads the code and nothing more. A job in CI's own image
# reads packages too, to pull it; a job's own `permissions` replaces these.
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions:
  contents: read

jobs:
  # Separate jobs, so each result arrives as soon as it's known: a formatting
  # slip shows up in a minute, not after the tests.
  checks:
    name: Lint, format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      # node_modules itself, kept for each lockfile and Node version: unpacking
      # it takes seconds, where npm ci takes most of a minute. Every job of
      # the site's does the same. Nothing is installed outside node_modules.
      - name: Cache dependencies
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Every check runs even if an earlier one fails, so one push reports
      # them all.
      # Fails on warnings too. Our own rules keep Airtable, Luma and the
      # database each behind one file (eslint.config.mjs).
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Lint CSS
        if: ${{ !cancelled() }}
        run: npm run lint:css

      - name: Find unused files, exports and dependencies
        if: ${{ !cancelled() }}
        run: npm run lint:unused

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

      # Copy still waiting for a person to write it (AGENTS.md, "Never write
      # final copy"). Here, not among the tests, so a branch whose copy
      # waits still gets its coverage checked.
      - name: Check no copy is a placeholder
        if: ${{ !cancelled() }}
        run: npm run placeholders

  # The types, on their own, so a type error is one red job saying what's
  # wrong in seconds. The Build job waits for this one, as `next build`
  # checks types too, and shows as skipped rather than failing with the same
  # error at the end of a long log. The storyboard doesn't wait: its builds
  # skip the types (SKIP_BUILD_TYPES, next.config.ts). It first checks that no
  # migration already pushed has changed, and that new ones come after
  # main's, either of which would fail the deploy.
  types:
    name: Types, migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The history, to compare the migrations with main's and with the push before.
          fetch-depth: 0

      - name: Check pushed migrations are unchanged
        # `before` is the branch's last push (or main's last commit), all
        # zeros on a first push, and missing when a pull request opens.
        run: node scripts/migrations-unchanged.mjs --main "${{ github.event.before }}"

      - name: Check new migrations come after main's
        # A pull request's checkout is the branch merged into main, so this
        # fails one whose number main has taken, or passed, since it began.
        run: node scripts/migration-order.mjs

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Cache dependencies
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check types
        run: npm run typecheck

  # The tests split between three jobs, by Vitest's own `--shard`. Each
  # writes its coverage, with Vitest's thresholds off, as a shard can't know
  # what the others cover; the Test job merges and checks them.
  test-shard:
    name: Test (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # CI's own image (.github/ci-image/Dockerfile): Chromium's system
    # packages, Git and the Postgres 18 client, so the job installs none of
    # them. Its tag is its Dockerfile's hash (tests/checks/ci-image.test.ts).
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/pauseai-uk/ci:4a78405e3585
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Tests that need a database make their own in this Postgres
    # (tests/database.ts, scripts/fresh-database.mjs). From inside the
    # container it's reached by its name, which LOCAL_POSTGRES_HOST names as
    # on this machine (scripts/fresh-database.mjs, isLocal).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          # Production's collation, not the image's en_US (docs/development.md, "Collation").
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C.UTF-8 --encoding=UTF8
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      LOCAL_POSTGRES_HOST: postgres
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      # As the first job does: node_modules, kept for each lockfile and Node version.
      - name: Cache dependencies
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Chromium, at @playwright/test's version, kept for each version: the
      # image has its system packages but not the browser.
      - name: Read Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v6
        with:
          path: /ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Both Vitest projects (node and browser), a third of their files. The
      # browser project renders components in Chromium.
      - name: Test
        run: >-
          npx vitest run --coverage --shard=${{ matrix.shard }}/3
          --coverage.reporter=json --coverage.thresholds.100=false --coverage.thresholds.perFile=false

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/coverage-final.json
          retention-days: 1

  # One result for the parts, under the test check's own name: it fails if
  # any part did, and otherwise merges their coverage and checks every
  # file is at 100%, as `npm test` does (scripts/merge-coverage.mjs).
  test:
    name: Test
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: test "${{ needs.test-shard.result }}" = success

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      # As the first job does: node_modules, kept for each lockfile and Node version.
      - name: Cache dependencies
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*

      - name: Every file at 100% coverage
        run: node scripts/merge-coverage.mjs coverage-*/coverage-final.json

  build:
    name: Build
    needs: types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      # As the first job does: node_modules, kept for each lockfile and Node version.
      - name: Cache dependencies
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Turbopack's work and the resized images from the last build, so this
      # one starts warm (Next checks what it reuses against the sources).
      # Kept for each commit, and taken from the newest there is.
      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-build-${{ runner.os }}-

      # `next build` alone. Netlify's `npm run build` runs the unit tests and
      # the linters first, which the jobs above do, with a Postgres.
      - name: Build
        run: npx next build

  # The flows split between four jobs, each building the site: the flows
  # are most of the time, the setup and the build a minute or so. They're
  # dealt in turn, so a section's slow flows don't all land in one part.
  # On main, every flow runs.
  # On a pull request, only those its change can reach, by what each opened
  # when main last ran it, and a few spot checks (scripts/ci-parts.mjs,
  # reachedForCi; docs/testing.md, "Which flows CI runs").
  storyboard-shard:
    name: Storyboard (${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # In CI's own image, as the Test job is.
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/pauseai-uk/ci:4a78405e3585
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Tests that need a database make their own in this Postgres
    # (tests/database.ts, scripts/fresh-database.mjs), reached by its name
    # as in the Test job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          # Production's collation, not the image's en_US (docs/development.md, "Collation").
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C.UTF-8 --encoding=UTF8
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      LOCAL_POSTGRES_HOST: postgres
      # The Types job checks them, beside this one (next.config.ts).
      SKIP_BUILD_TYPES: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      # As the first job does: node_modules, kept for each lockfile and Node version.
      - name: Cache dependencies
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # As the Test job does: Chromium, kept for each Playwright version.
      - name: Read Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v6
        with:
          path: /ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # As the Build job does, for the fixture build: kept apart, as its
      # settings differ.
      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-storyboard-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-storyboard-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-storyboard-${{ matrix.shard }}-${{ runner.os }}-

      # playwright.config.ts's webServer builds and starts the app itself, so
      # there is no separate build step here. The gate takes no screenshots;
      # the comparison with main (npm run storyboard) is run by hand.
      # How long each flow took, as the Storyboard job kept it from the
      # latest run: on main, or this branch's.
      # On a pull request: what each flow opened when main's CI ran every
      # flow on main's commit, which the Storyboard job keeps. By that commit
      # alone, never the newest kept, so every part chooses from the same
      # record. With none kept for it, every flow runs.
      - name: Restore what main's flows opened
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: storyboard-opened.json
          key: storyboard-opened-${{ github.event.pull_request.base.sha }}

      # Main's commit, to tell what the pull request changes.
      - name: Fetch main's commit
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      # A quarter of the flows (scripts/ci-parts.mjs): every part deals the
      # same, and runs its own. On a pull request, of the flows it can reach.
      - name: Choose this part's flows
        id: choose
        run: |
          node scripts/ci-parts.mjs storyboard ${{ matrix.shard }}/4 part-flows.txt \
            ${{ github.event_name == 'pull_request' && format('storyboard-opened.json {0}', github.event.pull_request.base.sha) || '' }}
          echo "flows=$(grep -c . part-flows.txt || true)" >> "$GITHUB_OUTPUT"

      # A part with no flows dealt to it runs none: Playwright would take an
      # empty list as every flow.
      - name: Storyboard
        if: steps.choose.outputs.flows != '0'
        run: npm run test:storyboard -- --test-list=part-flows.txt
        env:
          STORYBOARD_OPENED: part-opened.json

      - name: Upload what the flows opened
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: storyboard-opened-${{ matrix.shard }}
          path: part-opened.json
          retention-days: 1

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # One result for the four parts, under the storyboard check's own name.
  # It runs whatever they did, so a failed part fails it, rather than
  # leaving it skipped. On main, when they all passed, it keeps what every
  # flow opened, by main's commit, for pull requests to choose by.
  storyboard:
    name: Storyboard
    needs: storyboard-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: test "${{ needs.storyboard-shard.result }}" = success

      - name: Download what the flows opened
        if: github.event_name == 'push'
        uses: actions/download-artifact@v8
        with:
          pattern: storyboard-opened-*

      - name: Merge what the flows opened
        if: github.event_name == 'push'
        run: |
          jq -s '{recording: .[0].recording, flows: (map(.flows) | add)}' storyboard-opened-*/part-opened.json > storyboard-opened.json

      - name: Keep what the flows opened
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: storyboard-opened.json
          key: storyboard-opened-${{ github.sha }}

  # The database backup's own package (backup/README.md): its tests, with
  # their coverage gate, and its types.
  backup:
    name: Backup
    runs-on: ubuntu-latest
    # Its tests make their own databases in this Postgres, as the site's do.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          # Production's collation, not the image's en_US (docs/development.md, "Collation").
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C.UTF-8 --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: backup
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub's runners fetch Ubuntu's packages from Azure's mirror
      # (/etc/apt/apt-mirrors.txt), which sometimes stalls partway through a
      # download, and at times the runners can't look up any ubuntu.com name.
      # So apt uses mirrors outside ubuntu.com, not Azure's at all: apt picks
      # from the list for each file, and a lookup of Azure's that hangs costs
      # every file it picks it for 20 seconds. And every apt-get below,
      # Playwright's too, gives up on a download that sends nothing for 20
      # seconds and tries it again, up to three times.
      - name: Give apt mirrors outside ubuntu.com, and retry stalled downloads
        run: |
          printf '%s\n' http://mirrors.edge.kernel.org/ubuntu/ http://mirrors.mit.edu/ubuntu/ \
            http://mirror.math.princeton.edu/pub/ubuntu/ \
            | sudo tee /etc/apt/apt-mirrors.txt
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "npm"
          cache-dependency-path: backup/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The server too, not just the client: each backup is restored into a
      # scratch Postgres of its own, made with initdb and pg_ctl.
      - name: Install Postgres 18
        timeout-minutes: 4
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Test with coverage
        run: npm test

      - name: Check types
        if: ${{ !cancelled() }}
        run: npm run typecheck
