[build]
  command = "npm run build"
  publish = ".next"
  # Skips the build (exit 0) when nothing since the last one changes the site:
  # only docs, plans, CI, the backup Worker, Markdown anywhere or tests.
  # Each production deploy costs credits. A first build, or a rebuild of the
  # same commit, always builds.
  ignore = """
    [ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] &&
    git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ':(exclude)docs' ':(exclude)plans' \
      ':(exclude).github' ':(exclude)backup' ':(exclude,top)*.md' ':(exclude,glob)**/*.test.ts' \
      ':(exclude,glob)**/*.test.tsx'
  """

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The home page's photos, which browsers keep for a week rather than asking
# again on every visit (Netlify's default for a static file). Netlify's Image
# CDN gives the sizes next/image asks for the same header
# (https://docs.netlify.com/build/image-cdn/overview/). A photo changed keeps
# its old look for up to a week, so a new one takes a new name.
[[headers]]
  for = "/images/front-page-hero-optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[context.deploy-preview]
  command = "npm run build"
