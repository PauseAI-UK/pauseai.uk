# Optional checks on the files you're committing, if you've run
# `npm run hooks:install` (docs/development.md). Prettier formats the files
# itself; then `git add` them and commit again. CI runs these and more
# either way. After a checkout or merge, investments/ranked.txt is written
# again (scripts/investments.mjs). Before a push, it checks that no migration
# already pushed has changed (scripts/migrations-unchanged.mjs), and that new
# ones come after main's (scripts/migration-order.mjs).
default_install_hook_types: [pre-commit, post-checkout, post-merge, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types: [text]
      - id: eslint
        name: ESLint
        entry: npx eslint --max-warnings 0 --no-warn-ignored
        language: system
        files: \.[cm]?[jt]sx?$
      - id: stylelint
        name: Stylelint
        entry: npx stylelint --allow-empty-input
        language: system
        files: \.css$
      - id: investments
        name: investments/ranked.txt
        entry: node scripts/investments.mjs --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-checkout, post-merge]
      - id: migrations-unchanged
        name: Pushed migrations unchanged
        entry: node scripts/migrations-unchanged.mjs --main --pushed
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: migration-order
        name: New migrations after main's
        entry: node scripts/migration-order.mjs --open-prs
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
